<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Share feedback and support requests with the PointIQ team."
    />
    <meta name="theme-color" content="#031225" />
    <title>PointIQ Feedback &amp; Support</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header" aria-label="PointIQ">
        <a class="wordmark" href="./" aria-label="PointIQ home">
          <span class="wordmark-point">Point</span><span class="wordmark-iq">IQ</span>
        </a>
      </header>

      <div class="content-grid" id="feedback-page">
        <section class="intro" aria-labelledby="page-title">
          <h1 id="page-title">Help Improve PointIQ</h1>
          <p class="intro-copy">
            Share your experience, suggest improvements, or report a problem.
          </p>
        </section>

        <fieldset class="form-card">
          <legend class="card-kicker">We are listening</legend>
          <form id="feedback-form" novalidate>
            <fieldset class="category-group" aria-describedby="category-error">
              <legend>What would you like to share?</legend>
              <div class="category-options">
                <label class="category-option">
                  <input type="radio" name="category" value="problem" />
                  <svg class="category-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17C9F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
                    <path d="M12 9v4" />
                    <path d="M12 17h.01" />
                  </svg>
                  <span class="category-content">
                    <span class="category-title">Report a Problem</span>
                    <span class="category-description">Something is not working as expected.</span>
                  </span>
                </label>
                <label class="category-option">
                  <input type="radio" name="category" value="improvement" />
                  <svg class="category-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17C9F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M9 18h6" />
                    <path d="M10 22h4" />
                    <path d="M15.09 14c.18-.82.55-1.31 1.18-1.87A6 6 0 1 0 7.76 12.1c.64.6 1.06 1.1 1.18 1.9Z" />
                    <path d="M9 14h6" />
                  </svg>
                  <span class="category-content">
                    <span class="category-title">Suggest an Improvement</span>
                    <span class="category-description">Share an idea that could make PointIQ better.</span>
                  </span>
                </label>
                <label class="category-option">
                  <input type="radio" name="category" value="general" />
                  <svg class="category-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17C9F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                  </svg>
                  <span class="category-content">
                    <span class="category-title">General Feedback</span>
                    <span class="category-description">Tell us about your overall experience.</span>
                  </span>
                </label>
              </div>
              <p class="field-error" id="category-error" aria-live="polite"></p>
            </fieldset>

            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>
        </fieldset>
      </div>

      <section
        class="problem-report-page"
        id="problem-report-page"
        aria-labelledby="problem-report-title"
        hidden
      >
        <button class="problem-back-button" id="back-to-feedback" type="button">
          Back to Feedback &amp; Support
        </button>
        <h1 id="problem-report-title">Report a Problem</h1>

        <form class="problem-report-form" id="problem-report-form">
          <div class="problem-field">
            <label class="problem-field-label" for="problem-type">1. Type of Problem</label>
            <select id="problem-type" name="problem-type" required>
              <option value="" selected disabled>Select a problem type</option>
              <option value="calculation-ocr">Auto Calculation / OCR</option>
              <option value="match-results-standings">Match Results / Standings</option>
              <option value="app-crash">App Crash</option>
              <option value="login-cloud-sync">Login / Cloud Sync</option>
              <option value="export-download">Export / Download</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="problem-field">
            <label class="problem-field-label" for="problem-description">2. Short Description</label>
            <textarea id="problem-description" name="problem-description" rows="5" required></textarea>
          </div>

          <div class="problem-field">
            <label class="problem-field-label" for="problem-email">3. Email Address (Optional)</label>
            <input
              class="problem-email-input"
              id="problem-email"
              name="problem-email"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Enter your email address"
              aria-describedby="problem-email-error"
            />
            <p class="problem-field-error" id="problem-email-error" aria-live="polite" hidden></p>
          </div>

          <div class="problem-field">
            <label class="problem-field-label" for="problem-attachment">4. Attach Image or Video</label>
            <input
              class="problem-file-input"
              id="problem-attachment"
              name="problem-attachment"
              type="file"
              accept="image/*,video/*"
            />
            <div class="problem-file-controls">
              <label class="problem-file-picker" for="problem-attachment">Choose file</label>
              <span class="problem-file-name" id="problem-file-name" aria-live="polite" hidden></span>
              <button class="problem-remove-file" id="problem-remove-file" type="button" hidden>
                Remove
              </button>
            </div>
          </div>

          <button class="submit-button" id="problem-submit-button" type="submit" disabled>
            Submit Report
          </button>
          <div class="turnstile-slot" id="problem-turnstile" hidden></div>
          <p class="submission-status" id="problem-submission-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section
        class="problem-report-page"
        id="suggestion-page"
        aria-labelledby="suggestion-title"
        hidden
      >
        <button class="problem-back-button" id="back-to-suggestion" type="button">
          Back to Feedback &amp; Support
        </button>
        <h1 id="suggestion-title">Suggest an Improvement</h1>

        <form class="problem-report-form" id="suggestion-form">
          <div class="problem-field">
            <label class="problem-field-label" for="suggestion-type">1. What should we improve?</label>
            <select id="suggestion-type" name="suggestion-type" required>
              <option value="" selected disabled>Select an improvement area</option>
              <option value="calculation-ocr">Auto Calculation / OCR</option>
              <option value="match-results-standings">Match Results / Standings</option>
              <option value="templates-export">Templates / Export</option>
              <option value="app-design-usability">App Design / Usability</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="problem-field">
            <label class="problem-field-label" for="suggestion-description">2. Describe Your Suggestion</label>
            <textarea
              id="suggestion-description"
              name="suggestion-description"
              rows="5"
              required
              placeholder="What would you like us to add or improve?"
            ></textarea>
          </div>

          <div class="problem-field">
            <label class="problem-field-label" for="suggestion-email">3. Email Address (Optional)</label>
            <input
              class="problem-email-input"
              id="suggestion-email"
              name="suggestion-email"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Enter your email address"
              aria-describedby="suggestion-email-error"
            />
            <p class="problem-field-error" id="suggestion-email-error" aria-live="polite" hidden></p>
          </div>

          <button class="submit-button" id="suggestion-submit-button" type="submit" disabled>
            Submit Suggestion
          </button>
          <div class="turnstile-slot" id="suggestion-turnstile" hidden></div>
          <p class="submission-status" id="suggestion-submission-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section
        class="problem-report-page"
        id="general-feedback-page"
        aria-labelledby="general-feedback-title"
        hidden
      >
        <button class="problem-back-button" id="back-to-general-feedback" type="button">
          Back to Feedback &amp; Support
        </button>
        <h1 id="general-feedback-title">General Feedback</h1>

        <form class="problem-report-form" id="general-feedback-form">
          <fieldset class="problem-field general-rating-group">
            <legend class="problem-field-label">1. How was your experience with PointIQ?</legend>
            <div class="general-rating-options">
              <label class="general-rating-option">
                <input type="radio" name="general-rating" value="excellent" required />
                <span>Excellent</span>
              </label>
              <label class="general-rating-option">
                <input type="radio" name="general-rating" value="good" />
                <span>Good</span>
              </label>
              <label class="general-rating-option">
                <input type="radio" name="general-rating" value="average" />
                <span>Average</span>
              </label>
              <label class="general-rating-option">
                <input type="radio" name="general-rating" value="poor" />
                <span>Poor</span>
              </label>
            </div>
          </fieldset>

          <div class="problem-field">
            <label class="problem-field-label" for="general-feedback-description">2. Share Your Feedback</label>
            <textarea
              id="general-feedback-description"
              name="general-feedback-description"
              rows="5"
              required
              placeholder="Tell us about your experience with PointIQ..."
            ></textarea>
          </div>

          <div class="problem-field">
            <label class="problem-field-label" for="general-feedback-email">3. Email Address (Optional)</label>
            <input
              class="problem-email-input"
              id="general-feedback-email"
              name="general-feedback-email"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Enter your email address"
              aria-describedby="general-feedback-email-error"
            />
            <p class="problem-field-error" id="general-feedback-email-error" aria-live="polite" hidden></p>
          </div>

          <button class="submit-button" id="general-feedback-submit-button" type="submit" disabled>
            Submit Feedback
          </button>
          <div class="turnstile-slot" id="general-feedback-turnstile" hidden></div>
          <p class="submission-status" id="general-feedback-submission-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <footer class="site-footer">
        <span>PointIQ</span>
        <span aria-hidden="true">•</span>
        <span>Feedback &amp; Support</span>
      </footer>
    </main>
  </body>
</html>
