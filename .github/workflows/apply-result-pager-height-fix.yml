name: Apply result pager height fix

on:
  push:
    branches:
      - fix/result-pager-current-page-height

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/result-pager-current-page-height
      - name: Apply focused UI-only pager fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/hoggamers/rankforge/presentation/screen/MatchReviewScreen.kt")
          raw = path.read_bytes()
          has_bom = raw.startswith(b"\xef\xbb\xbf")
          text = raw.decode("utf-8-sig")

          function_start = text.index("private fun StableHeightHorizontalPager(")
          function_end = text.index("\n@Composable\ninternal fun MatchReviewScreenshotActionRow", function_start)
          function = text[function_start:function_end]

          measure_start_marker = "        val pageMeasurementConstraints = constraints.copy(minWidth = 0, minHeight = 0)\n"
          measure_end_marker = "        val pageHeight = measuredPageHeight\n"
          measure_start = function.index(measure_start_marker)
          measure_end = function.index(measure_end_marker, measure_start)

          new_measure = '''        val pageMeasurementConstraints = constraints.copy(minWidth = 0, minHeight = 0)
          val measurementPages = if (pageCount > 0) {
              val currentPage = state.currentPage.coerceIn(0, pageCount - 1)
              if (state.isScrollInProgress) {
                  listOf(currentPage, state.targetPage.coerceIn(0, pageCount - 1)).distinct()
              } else {
                  listOf(currentPage)
              }
          } else {
              emptyList()
          }
          val measuredPageHeight = measurementPages.maxOfOrNull { page ->
              subcompose("measure-page-$page") { pageContent(page) }
                  .map { measurable -> measurable.measure(pageMeasurementConstraints).height }
                  .maxOrNull()
                  ?: 0
          } ?: 0
          '''
          new_measure = "\n".join(line[8:] if line.startswith("        ") else line for line in new_measure.split("\n"))
          new_measure = "\n".join(("        " + line) if line else line for line in new_measure.split("\n"))

          function = function[:measure_start] + new_measure + function[measure_end:]

          pager_anchor = "                pageSpacing = RankForgeSpacing.ExtraSmall,\n"
          if function.count(pager_anchor) != 1:
              raise SystemExit(f"Expected one pager anchor, found {function.count(pager_anchor)}")
          function = function.replace(
              pager_anchor,
              pager_anchor + "                verticalAlignment = Alignment.Top,\n",
              1,
          )

          updated = text[:function_start] + function + text[function_end:]
          encoded = updated.encode("utf-8")
          if has_bom:
              encoded = b"\xef\xbb\xbf" + encoded
          path.write_bytes(encoded)
          PY
      - name: Commit focused UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hoggamers/rankforge/presentation/screen/MatchReviewScreen.kt
          git diff --cached --check
          git commit -m "fix(ui): size result pager to visible page"
          git push origin HEAD:fix/result-pager-current-page-height
