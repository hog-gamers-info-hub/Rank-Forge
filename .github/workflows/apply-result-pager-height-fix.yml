name: Apply result pager height fix

on:
  push:
    branches:
      - fix/result-pager-current-page-height

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/result-pager-current-page-height
      - name: Apply focused UI-only pager fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/hoggamers/rankforge/presentation/screen/MatchReviewScreen.kt")
          raw = path.read_bytes()
          has_bom = raw.startswith(b"\xef\xbb\xbf")
          text = raw.decode("utf-8-sig")

          old = '''    SubcomposeLayout(modifier = modifier) { constraints ->
              val pageMeasurementConstraints = constraints.copy(minWidth = 0, minHeight = 0)
              val measuredPageHeight = (0 until pageCount).maxOfOrNull { page ->
                  subcompose("measure-page-$page") { pageContent(page) }
                      .map { measurable -> measurable.measure(pageMeasurementConstraints).height }
                      .maxOrNull()
                      ?: 0
              } ?: 0
              val pageHeight = measuredPageHeight
                  .coerceAtLeast(constraints.minHeight)
                  .let { measured ->
                      if (constraints.hasBoundedHeight) measured.coerceAtMost(constraints.maxHeight) else measured
                  }
              val pagerConstraints = constraints.copy(minHeight = pageHeight, maxHeight = pageHeight)
              val pager = subcompose("pager") {
                  HorizontalPager(
                      state = state,
                      pageSize = androidx.compose.foundation.pager.PageSize.Fill,
                      pageSpacing = RankForgeSpacing.ExtraSmall,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(pageHeight.toDp()),
                      pageContent = { page -> pageContent(page) },
                  )
              }.single().measure(pagerConstraints)
              layout(pager.width, pageHeight) {
                  pager.place(0, 0)
              }
          }
          '''

          new = '''    SubcomposeLayout(modifier = modifier) { constraints ->
              val pageMeasurementConstraints = constraints.copy(minWidth = 0, minHeight = 0)
              val measurementPages = if (pageCount > 0) {
                  val currentPage = state.currentPage.coerceIn(0, pageCount - 1)
                  if (state.isScrollInProgress) {
                      listOf(currentPage, state.targetPage.coerceIn(0, pageCount - 1)).distinct()
                  } else {
                      listOf(currentPage)
                  }
              } else {
                  emptyList()
              }
              val measuredPageHeight = measurementPages.maxOfOrNull { page ->
                  subcompose("measure-page-$page") { pageContent(page) }
                      .map { measurable -> measurable.measure(pageMeasurementConstraints).height }
                      .maxOrNull()
                      ?: 0
              } ?: 0
              val pageHeight = measuredPageHeight
                  .coerceAtLeast(constraints.minHeight)
                  .let { measured ->
                      if (constraints.hasBoundedHeight) measured.coerceAtMost(constraints.maxHeight) else measured
                  }
              val pagerConstraints = constraints.copy(minHeight = pageHeight, maxHeight = pageHeight)
              val pager = subcompose("pager") {
                  HorizontalPager(
                      state = state,
                      pageSize = androidx.compose.foundation.pager.PageSize.Fill,
                      pageSpacing = RankForgeSpacing.ExtraSmall,
                      verticalAlignment = Alignment.Top,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(pageHeight.toDp()),
                      pageContent = { page -> pageContent(page) },
                  )
              }.single().measure(pagerConstraints)
              layout(pager.width, pageHeight) {
                  pager.place(0, 0)
              }
          }
          '''

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one pager block, found {text.count(old)}")

          updated = text.replace(old, new, 1)
          encoded = updated.encode("utf-8")
          if has_bom:
              encoded = b"\xef\xbb\xbf" + encoded
          path.write_bytes(encoded)
          PY
      - name: Commit focused UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hoggamers/rankforge/presentation/screen/MatchReviewScreen.kt
          git diff --cached --check
          git commit -m "fix(ui): size result pager to visible page"
          git push origin HEAD:fix/result-pager-current-page-height
